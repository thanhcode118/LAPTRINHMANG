<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gửi Email Gmail</title>
    <link href="https://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            margin-top: 20px;
        }

        .email-app {
            display: flex;
            flex-direction: row;
            background: #fff;
            border: 1px solid #e1e6ef;
        }

            .email-app nav {
                flex: 0 0 200px;
                padding: 1rem;
                border-right: 1px solid #e1e6ef;
            }

                .email-app nav .btn-block {
                    margin-bottom: 15px;
                }

                .email-app nav .nav {
                    flex-direction: column;
                }

                    .email-app nav .nav .nav-item {
                        position: relative;
                    }

                    .email-app nav .nav .nav-link {
                        color: #151b1e;
                        border-bottom: 1px solid #e1e6ef;
                    }

                        .email-app nav .nav .nav-link i {
                            width: 20px;
                            margin-right: 10px;
                            font-size: 14px;
                            text-align: center;
                        }

            .email-app main {
                flex: 1;
                padding: 1rem;
            }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* Căn giữa toàn bộ danh sách */
        }

        .sidebar-item {
            margin: 10px 0;
            width: 180px; /* Đảm bảo các item có chiều rộng cố định để dễ căn giữa */
        }

        .sidebar-link {
            display: flex;
            justify-content: center; /* Căn giữa nội dung bên trong theo chiều ngang */
            align-items: center; /* Căn giữa theo chiều dọc */
            gap: 8px; /* Khoảng cách giữa icon và chữ */
            text-decoration: none;
            color: #000;
            background-color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-weight: bold;
        }

            .sidebar-link .badge {
                background-color: #f44336;
                color: white;
                border-radius: 10px;
                padding: 2px 8px;
                font-size: 12px;
                margin-left: 5px;
            }
    </style>
</head>
<body>
    <div class="container bootdey">
        <div class="email-app">
            <nav>
                <a href="#" id="backBtn" class="btn btn-danger btn-block">Back to inbox</a>
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="inbox.html" class="sidebar-link active">
                            <i class="fa fa-inbox"></i> Inbox <span class="badge">4</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="Starred.html" class="sidebar-link">
                            <i class="fa fa-star"></i> Starred
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="sent.html" class="sidebar-link">
                            <i class="fa fa-rocket"></i> Sent
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="Trash.html" class="sidebar-link">
                            <i class="fa fa-trash-o"></i> Trash
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="Important.html" class="sidebar-link">
                            <i class="fa fa-bookmark"></i> Important
                        </a>
                    </li>
                </ul>
            </nav>
            <main>
                <p class="text-center">Send Email</p>
                <form id="sendForm">
                    <div class="form-row mb-3">
                        <label for="toEmail" class="col-2 col-sm-1 col-form-label">To:</label>
                        <div class="col-10 col-sm-11">
                            <input type="email" class="form-control" id="toEmail" placeholder="Enter recipient email" required>
                        </div>
                    </div>
                    <div class="form-row mb-3">
                        <label for="subject" class="col-2 col-sm-1 col-form-label">Topic:</label>
                        <div class="col-10 col-sm-11">
                            <input type="text" class="form-control" id="subject" placeholder="Enter your topic" required>
                        </div>
                    </div>
                    <div class="form-row mb-3">
                        <label for="body" class="col-2 col-sm-1 col-form-label">Content:</label>
                        <div class="col-10 col-sm-11">
                            <textarea class="form-control" id="body" rows="12" placeholder="Enter email content" required></textarea>
                        </div>
                    </div>
                    <div class="form-group text-right">
                        <button type="submit" class="btn btn-success">Send</button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
    <script src="https://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>
    <script>
        const email = sessionStorage.getItem('email');
        const appPassword = sessionStorage.getItem('appPassword');
        if (!email || !appPassword) {
            alert('Bạn chưa đăng nhập!');
            window.location.href = 'inbox.html';
        }

        document.getElementById('sendForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const toEmail = document.getElementById('toEmail').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const body = document.getElementById('body').value.trim();

            fetch('/api/email/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fromEmail: email,
                    appPassword,
                    toEmail,
                    subject,
                    body
                })
            })
                .then(res => {
                    if (res.ok) {
                        alert('Gửi email thành công!');
                        window.location.href = 'inbox.html';
                    } else {
                        alert('Gửi email thất bại.');
                    }
                })
                .catch(() => alert('Lỗi gửi email.'));
        });

        document.getElementById('backBtn').onclick = () => {
            window.location.href = 'inbox.html';
        };
    </script>
</body>
</html>
